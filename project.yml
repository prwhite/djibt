name: OsmoMulti
options:
  bundleIdPrefix: me.payton
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: L485BLVU52
    CODE_SIGN_STYLE: Automatic

targets:
  DJIOsmoKit:
    type: framework
    platform: iOS
    sources:
      - path: DJIOsmoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.payton.DJIOsmoKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  DJIOsmoKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DJIOsmoKitTests
    dependencies:
      - target: DJIOsmoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.payton.DJIOsmoKitTests
        GENERATE_INFOPLIST_FILE: YES

  OsmoMulti:
    type: application
    platform: iOS
    sources:
      - path: OsmoMulti
    info:
      path: OsmoMulti/Info.plist
      properties:
        CFBundleName: "Cam Control for DJI Osmo"
        CFBundleDisplayName: "Cam Control"
        NSBluetoothAlwaysUsageDescription: "Cam Control requires Bluetooth to connect to and control DJI Osmo cameras."
        NSLocationWhenInUseUsageDescription: "Cam Control uses your location to geotag video footage on connected DJI Osmo cameras."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: DJIOsmoKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.payton.OsmoMulti
