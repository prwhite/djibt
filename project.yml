name: OsmoMulti
options:
  bundleIdPrefix: net.prehiti.payton
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: L485BLVU52
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: 1
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  DJIOsmoKit:
    type: framework
    platform: iOS
    sources:
      - path: DJIOsmoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehiti.payton.DJIOsmoKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        ENABLE_MODULE_VERIFIER: YES
        MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"

  DJIOsmoKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DJIOsmoKitTests
    dependencies:
      - target: DJIOsmoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehiti.payton.DJIOsmoKitTests
        GENERATE_INFOPLIST_FILE: YES

  OsmoMulti:
    type: application
    platform: iOS
    sources:
      - path: OsmoMulti
      - path: content/djibt-ios.icon
        buildPhase: resources
    info:
      path: OsmoMulti/Info.plist
      properties:
        CFBundleName: "Cam Control for DJI Osmo"
        CFBundleDisplayName: "Cam Control"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSBluetoothAlwaysUsageDescription: "Cam Control requires Bluetooth to connect to and control DJI Osmo cameras."
        NSLocationWhenInUseUsageDescription: "Cam Control uses your location to geotag video footage on connected DJI Osmo cameras."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: DJIOsmoKit
        embed: true
      - target: OsmoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehiti.payton.CamControl
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: djibt-ios

  OsmoWatch:
    type: application
    platform: watchOS
    sources:
      - path: OsmoWatch
      - path: content/djibt-ios.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehiti.payton.CamControl.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: net.prehiti.payton.CamControl
        ASSETCATALOG_COMPILER_APPICON_NAME: djibt-ios

schemes:
  DJIOsmoKit:
    build:
      targets:
        DJIOsmoKit: all
    test:
      config: Debug
      targets:
        - DJIOsmoKitTests

  OsmoMulti:
    build:
      targets:
        OsmoMulti: all
    run:
      config: Release
    test:
      config: Debug
      targets:
        - DJIOsmoKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  OsmoWatch:
    build:
      targets:
        OsmoWatch: all
        OsmoMulti: all
    run:
      config: Release
      executable: OsmoWatch
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
