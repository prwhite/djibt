name: OsmoMulti
options:
  bundleIdPrefix: net.prehiti.payton
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

# Signing identity (DEVELOPMENT_TEAM) + BUNDLE_ID_PREFIX come from
# Config/Signing.xcconfig (committed owner defaults; optionally overridden by a
# gitignored Config/Signing.local.xcconfig). Keeping them OUT of project.yml's
# settings means the generated project.pbxproj holds no developer-specific
# identity — see Config/Signing.xcconfig for the rationale.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.9.6"
    CURRENT_PROJECT_VERSION: 1
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  DJIOsmoKit:
    type: framework
    platform: iOS
    sources:
      - path: DJIOsmoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).DJIOsmoKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        ENABLE_MODULE_VERIFIER: YES
        MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"

  DJIOsmoKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DJIOsmoKitTests
    dependencies:
      - target: DJIOsmoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).DJIOsmoKitTests
        GENERATE_INFOPLIST_FILE: YES

  OsmoMulti:
    type: application
    platform: iOS
    sources:
      - path: OsmoMulti
      - path: LiveActivityShared   # ActivityAttributes + LiveActivityIntents (also compiled into OsmoWidgets)
      - path: content/djibt-ios.icon
        buildPhase: resources
    info:
      path: OsmoMulti/Info.plist
      properties:
        CFBundleName: "Cam Control for DJI Osmo"
        CFBundleDisplayName: "$(BUNDLE_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSupportsLiveActivities: true
        NSBluetoothAlwaysUsageDescription: "Cam Control requires Bluetooth to connect to and control DJI Osmo cameras."
        # bluetooth-central: keep camera connections + event processing alive while
        # backgrounded/locked — drop detection (and its notifications, which then
        # mirror to Apple Watch when the phone is locked) and watch-relayed commands
        # work with the phone pocketed. Always-on by design: the cost window is
        # bounded by cameras being on; no toggle (same action must not behave
        # differently on hidden state).
        # location: keep CoreLocation delivering while backgrounded/locked so GPS
        # push doesn't go stale → Void mid-recording with the phone pocketed. Only
        # active while the user has GPS push enabled (the GPS toggle is the
        # battery/privacy bound); shows the system location indicator while
        # backgrounded — honest and intentional.
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSLocationWhenInUseUsageDescription: "Cam Control uses your location to geotag video footage on connected DJI Osmo cameras."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: DJIOsmoKit
        embed: true
      - target: OsmoWatch
      - target: OsmoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CamControl
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: djibt-ios
        BUNDLE_DISPLAY_NAME: "Cam Control"
      configs:
        Debug:
          BUNDLE_DISPLAY_NAME: "Cam Control 🛠"

  OsmoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OsmoWidgets
      - path: LiveActivityShared   # shared with the app — see that dir's headers
    info:
      path: OsmoWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Cam Control"
        # Must track the app's version or App Store Connect rejects the upload
        # (extension CFBundleShortVersionString must match the parent app).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CamControl.Widgets
        SKIP_INSTALL: YES

  OsmoWatch:
    type: application
    platform: watchOS
    sources:
      - path: OsmoWatch
      - path: content/djibt-watch.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CamControl.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).CamControl
        # User-facing name on the watch face. Matches the phone ("Cam Control")
        # rather than the internal target name — drops the redundant "Watch" and
        # keeps DJI's "Osmo" trademark out of any user-visible label.
        INFOPLIST_KEY_CFBundleDisplayName: "Cam Control"
        ASSETCATALOG_COMPILER_APPICON_NAME: djibt-watch
      configs:
        Debug:
          INFOPLIST_KEY_CFBundleDisplayName: "Cam Control 🛠"

schemes:
  DJIOsmoKit:
    build:
      targets:
        DJIOsmoKit: all
    test:
      config: Debug
      targets:
        - DJIOsmoKitTests

  OsmoMulti:
    build:
      targets:
        OsmoMulti: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DJIOsmoKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  OsmoWatch:
    build:
      targets:
        OsmoWatch: all
        OsmoMulti: all
    run:
      config: Release
      executable: OsmoWatch
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
